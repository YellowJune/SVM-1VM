name: RNA page-gauge audit

on:
  workflow_dispatch:
  push:
    paths:
      - "rna_page_gauge_audit/audit_hf_bprna.py"
      - ".github/workflows/rna-page-gauge-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned audit dependency
        run: python -m pip install "pyarrow==21.0.0"
      - name: Audit graph-preserving page permutations
        run: python rna_page_gauge_audit/audit_hf_bprna.py
      - name: Exclude downloaded cache from evidence package
        run: rm -rf rna_page_gauge_audit/audit/cache
      - name: Upload immutable audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rna-page-gauge-audit-v0.2.0
          path: rna_page_gauge_audit/audit/
          if-no-files-found: error
